name: Desktop

# Builds the desktop app installers. Pull requests that touch the app get a
# build check; the Release workflow calls this with the tag so the
# installers are attached to the release GoReleaser created.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "cmd/envry/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to attach the installers to
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
          - name: linux
            # The oldest supported Ubuntu keeps the AppImage and .deb
            # working on older glibc versions.
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Rust tests
        if: matrix.name != 'macos'
        shell: bash
        working-directory: desktop
        # tauri-build needs the sidecar to exist before anything compiles.
        run: |
          npm run sidecar
          cargo test --lib --manifest-path src-tauri/Cargo.toml --locked

      - name: Build installers
        shell: bash
        working-directory: desktop
        env:
          ENVRY_VERSION: ${{ inputs.tag }}
          # The sidecar (and web UI) were already built for the tests.
          ENVRY_SKIP_WEB: ${{ matrix.name != 'macos' && '1' || '0' }}
          # Signs the update packages installed copies download. This is not
          # code signing: it proves an update was built here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(${{ matrix.args }})
          if [ -n "$ENVRY_VERSION" ]; then
            args+=(--config "{\"version\":\"${ENVRY_VERSION#v}\"}")
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          elif [ -n "$ENVRY_VERSION" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so installed copies will not be offered this release."
          fi
          npx tauri build "${args[@]}"

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          t=desktop/src-tauri/target
          # put FILE NAME copies a bundle under its release name, with its
          # update signature when updates are signed.
          put() {
            cp "$1" "out/$2"
            if [ -f "$1.sig" ]; then cp "$1.sig" "out/$2.sig"; fi
          }
          first() { echo "$1"; }
          case "${{ matrix.name }}" in
            windows)
              put "$(first "$t"/release/bundle/nsis/*-setup.exe)" Envry-setup-windows-x64.exe ;;
            macos)
              m="$t"/universal-apple-darwin/release/bundle
              put "$(first "$m"/dmg/*.dmg)" Envry-macos-universal.dmg
              # Installed copies update from the compressed app, not the dmg.
              for f in "$m"/macos/*.app.tar.gz; do
                if [ -f "$f" ]; then put "$f" Envry-macos-universal.app.tar.gz; fi
              done ;;
            linux)
              put "$(first "$t"/release/bundle/appimage/*.AppImage)" Envry-linux-x86_64.AppImage
              put "$(first "$t"/release/bundle/deb/*.deb)" envry-desktop_amd64.deb ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Attach to release
    if: inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: out

      - name: Update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        # latest.json is what installed copies read to find this release: the
        # signed update package for each platform, and the release notes.
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md || true
          python3 - <<'PY'
          import datetime, json, os, pathlib

          tag = os.environ["TAG"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          # Updater targets: {os}-{arch}-{bundle}, with {os}-{arch} as the fallback.
          packages = {
              "windows-x86_64": "Envry-setup-windows-x64.exe",
              "windows-x86_64-nsis": "Envry-setup-windows-x64.exe",
              "darwin-x86_64": "Envry-macos-universal.app.tar.gz",
              "darwin-aarch64": "Envry-macos-universal.app.tar.gz",
              "darwin-x86_64-app": "Envry-macos-universal.app.tar.gz",
              "darwin-aarch64-app": "Envry-macos-universal.app.tar.gz",
              "linux-x86_64": "Envry-linux-x86_64.AppImage",
              "linux-x86_64-appimage": "Envry-linux-x86_64.AppImage",
              "linux-x86_64-deb": "envry-desktop_amd64.deb",
          }
          out = pathlib.Path("out")
          platforms = {}
          for target, name in packages.items():
              sig = out / f"{name}.sig"
              if sig.exists():
                  platforms[target] = {"signature": sig.read_text().strip(), "url": f"{base}/{name}"}
          if not platforms:
              print("::warning::No signed update packages, so latest.json is not published.")
          else:
              notes = pathlib.Path("notes.md")
              manifest = {
                  "version": tag.removeprefix("v"),
                  "notes": notes.read_text().strip() if notes.exists() else "",
                  "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "platforms": platforms,
              }
              (out / "latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
              print(sorted(platforms))
          PY

      - name: Checksums
        run: cd out && sha256sum * > desktop-checksums.txt && cat desktop-checksums.txt

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" out/* --clobber --repo "${{ github.repository }}"
