<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Envry</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Drag area and window buttons, like the web UI's page header
         (web/src/components/layout/window-controls.tsx). -->
    <header class="titlebar" data-tauri-drag-region="deep">
      <div class="controls">
        <button type="button" id="minimize" aria-label="Minimize" title="Minimize">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
        </button>
        <button type="button" id="maximize" aria-label="Maximize" title="Maximize">
          <svg class="when-normal" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" /></svg>
          <svg class="when-maximized" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="14" height="14" x="2" y="8" rx="2" />
            <path d="M8 4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2" />
          </svg>
        </button>
        <button type="button" id="close" class="close" aria-label="Close" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
      </div>
    </header>
    <main>
      <div class="brand">
        <svg viewBox="0 0 32 32" role="img" aria-label="Envry logo">
          <defs>
            <linearGradient id="logo-tile" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" style="stop-color: var(--primary-top)" />
              <stop offset="1" style="stop-color: var(--primary-bottom)" />
            </linearGradient>
            <radialGradient id="logo-glow" cx="1" cy="1" r="0.8">
              <stop offset="0" style="stop-color: var(--primary-glow)" />
              <stop offset="1" style="stop-color: var(--primary-glow); stop-opacity: 0" />
            </radialGradient>
          </defs>
          <rect width="32" height="32" rx="7.5" fill="url(#logo-tile)" />
          <rect width="32" height="32" rx="7.5" fill="url(#logo-glow)" />
          <g transform="translate(4 3.6)" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="5" width="19" height="14" rx="2.5" />
            <path d="m3 6.5 7.2 5.4h3.6L21 6.5" />
            <path d="m13.5 10.5-2 3.5h3l-2 3.5" stroke-width="1.75" />
          </g>
        </svg>
        <span>Envry</span>
      </div>
      <section id="view" aria-live="polite"></section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
